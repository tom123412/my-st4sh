<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | MyStash</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1"
        integrity="sha384-Qp9rdC8H7EqOoX+nR0P3RPG2Noji+qdwJlGpfzwQJsfOpp3sGwIdSP9xO3+UlEhn"
        crossorigin="anonymous"></script>
</head>

<body class="min-h-screen bg-slate-100 px-4 py-8 font-sans text-slate-900 sm:px-6 sm:py-12">
    <div class="mx-auto max-w-5xl">
        <nav class="mb-8 flex items-center justify-between gap-3">
            <a href="/" class="font-semibold tracking-tight text-slate-800">MyStash</a>
            <div class="flex items-center gap-3">
                <form action="/api/logout" method="post">
                    <button type="submit"
                        class="rounded-lg border border-slate-300 bg-white px-4 py-2 font-medium text-slate-700 transition hover:bg-slate-50">Log
                        Out</button>
                </form>
            </div>
        </nav>

        <main class="overflow-hidden rounded-2xl bg-white shadow-xl ring-1 ring-slate-900/5">
            <header class="border-b border-slate-200 px-6 py-7 sm:px-8">
                <a href="/" class="text-sm font-medium text-sky-700 hover:text-sky-800">&larr; Home</a>
                <div class="mt-4 flex flex-wrap items-end justify-between gap-3">
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Transactions</h1>
                        <p class="mt-2 text-slate-600">Your activity from the past six months.</p>
                    </div>
                    <span
                        class="rounded-full bg-sky-50 px-3 py-1 text-sm font-medium text-sky-800">Newest&nbsp;first</span>
                </div>
            </header>

            <section aria-label="Recent transactions" class="p-3 sm:p-6">
                <div id="transactions-list" hx-get="/api/fragments/transactions"
                    hx-trigger="load" hx-swap="innerHTML" class="min-h-32">
                    <p class="px-4 py-10 text-center text-sm text-slate-500">Loading transactions...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.body.addEventListener("htmx:responseError", event => {
            if (event.detail.xhr.status === 401) {
                window.location.replace("/api/login?returnUrl=%2Ftransactions");
            }
        });
    </script>
</body>

</html>
