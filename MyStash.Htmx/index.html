<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspire + HTMX + Blazor BFF</title>
    <!-- Load HTMX safely via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1" integrity="sha384-Qp9rdC8H7EqOoX+nR0P3RPG2Noji+qdwJlGpfzwQJsfOpp3sGwIdSP9xO3+UlEhn" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            background: #f4f4f9;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }

        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #005a9e;
        }

        .catalog-item {
            margin-top: 10px;
            padding: 8px;
            border-left: 4px solid #0078d4;
            background: #f0f7ff;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Static SWA Frontend</h2>
        <p>Click below to request server-rendered HTML fragments from the Blazor BFF:</p>

        <!-- Pure production relative path -->
        <button hx-get="api/fragments/catalog" hx-target="#catalog-container" hx-swap="innerHTML">
            Fetch Latest Items
        </button>

        <div id="catalog-container" style="margin-top: 20px;">
            <!-- Rendered HTML will drop here seamlessly -->
        </div>
    </div>
</body>

</html>
