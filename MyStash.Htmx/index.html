<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspire + HTMX + Blazor BFF</title>
    <link rel="stylesheet" href="/styles.css">
    <!-- Load HTMX safely via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1"
        integrity="sha384-Qp9rdC8H7EqOoX+nR0P3RPG2Noji+qdwJlGpfzwQJsfOpp3sGwIdSP9xO3+UlEhn"
        crossorigin="anonymous"></script>
</head>

<body class="min-h-screen bg-slate-100 px-4 py-10 font-sans text-slate-900 sm:px-6">
    <div class="mx-auto max-w-md">
        <nav class="mb-6 flex items-center justify-between gap-3">
            <a href="/transactions" class="font-semibold text-slate-700 transition hover:text-sky-700">Transactions</a>
            <!-- Standard navigation link (NO hx-get or hx-boost) -->
            <a href="/api/login" class="rounded-lg bg-slate-800 px-4 py-2 font-medium text-white transition hover:bg-slate-700">Log In</a>

            <!-- For Logout, use a standard POST form or GET link depending on your BFF endpoint -->
            <form action="/api/logout" method="post">
                <button type="submit" class="rounded-lg border border-slate-300 bg-white px-4 py-2 font-medium text-slate-700 transition hover:bg-slate-50">Log Out</button>
            </form>
        </nav>

        <main class="rounded-2xl bg-white p-6 shadow-xl ring-1 ring-slate-900/5 sm:p-8">
            <h1 class="text-2xl font-bold tracking-tight">Static SWA Frontend</h1>
            <p class="mt-2 text-slate-600">Click below to request server-rendered HTML fragments from the Blazor BFF:</p>

            <!-- Pure production relative path -->
            <button hx-get="api/fragments/catalog" hx-target="#catalog-container" hx-swap="innerHTML"
                class="mt-6 rounded-lg bg-sky-600 px-4 py-2.5 font-semibold text-white transition hover:bg-sky-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                Fetch Latest Items
            </button>

            <div id="catalog-container" class="mt-5">
                <!-- Rendered HTML will drop here seamlessly -->
            </div>
        </main>
    </div>
</body>

</html>
