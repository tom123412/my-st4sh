<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspire + HTMX + Blazor BFF</title>
    <!-- Load HTMX safely via CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            background: #f4f4f9;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }

        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #005a9e;
        }

        .catalog-item {
            margin-top: 10px;
            padding: 8px;
            border-left: 4px solid #0078d4;
            background: #f0f7ff;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Static SWA Frontend</h2>
        <p>Click below to request server-rendered HTML fragments from the Blazor BFF:</p>

        <!-- Pure production relative path -->
        <button hx-get="/fragments/catalog" hx-target="#catalog-container" hx-swap="innerHTML">
            Fetch Latest Items
        </button>

        <div id="catalog-container" style="margin-top: 20px;">
            <!-- Rendered HTML will drop here seamlessly -->
        </div>
    </div>

    <script>
        // Local Dev Helper: Redirects local traffic to the dynamically assigned Aspire port
        // When deployed to Azure Static Web Apps, this block automatically self-disables.
        document.body.addEventListener('htmx:configRequest', (event) => {
            if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
                // Prepend the local Blazor BFF address (mapped dynamically in Step 4)
                event.detail.path = `https://localhost:7054${event.detail.path}`;
            }
        });
    </script>
</body>

</html>
